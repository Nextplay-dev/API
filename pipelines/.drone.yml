kind: pipeline
type: docker
name: build-amd64

trigger:
  event:
    - push
    - custom
  branch:
    - main

platform:
  os: linux
  arch: amd64

steps:
  - name: build
    image: plugins/docker
    settings:
      repo: ghcr.io/nextplay-dev/api
      tags:
        - ${DRONE_BUILD_NUMBER}-amd64
      dockerfile: ./docker/prod/Dockerfile
      context: .
      build_args:
        - "BUILDKIT_INLINE_CACHE=1"
      buildx: false
      registry: ghcr.io
      username:
        from_secret: GITHUB_USERNAME
      password:
        from_secret: GITHUB_TOKEN

---
kind: pipeline
type: docker
name: build-arm64

trigger:
  event:
    - push
    - custom
  branch:
    - main

platform:
  os: linux
  arch: arm64

steps:
  - name: build
    image: plugins/kaniko
    settings:
      repo: ghcr.io/nextplay-dev/api
      tags:
        - ${DRONE_BUILD_NUMBER}-arm64
      dockerfile: ./docker/prod/Dockerfile
      context: .
      build_args:
        - "BUILDKIT_INLINE_CACHE=1"
      buildx: false
      registry: ghcr.io
      username:
        from_secret: GITHUB_USERNAME
      password:
        from_secret: GITHUB_TOKEN
      mtu: 1400

---
kind: pipeline
type: docker
name: merge-deploy

trigger:
  event:
    - push
    - custom
  branch:
    - main

platform:
  os: linux
  arch: arm64

depends_on:
  - build-amd64
  - build-arm64

steps:
  - name: merge-images
    image: docker:24.0.5
    environment:
      GITHUB_USERNAME:
        from_secret: GITHUB_USERNAME
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USERNAME" --password-stdin
      - |
        docker buildx imagetools create \
          --tag ghcr.io/nextplay-dev/api:${DRONE_BUILD_NUMBER} \
          ghcr.io/nextplay-dev/api:${DRONE_BUILD_NUMBER}-amd64 \
          ghcr.io/nextplay-dev/api:${DRONE_BUILD_NUMBER}-arm64
      - |
        if [ "${DRONE_REPO_BRANCH}" = "main" ]; then
          docker buildx imagetools create \
            -t ghcr.io/nextplay-dev/api:latest \
            ghcr.io/nextplay-dev/api:${DRONE_BUILD_NUMBER}-amd64 \
            ghcr.io/nextplay-dev/api:${DRONE_BUILD_NUMBER}-arm64
        fi

---
kind: pipeline
type: docker
name: deploy

trigger:
  event:
    - promote
  target:
    - production

platform:
  os: linux
  arch: amd64

steps:
  - name: bump docker image version
    image: alpine/git:latest
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
      GITHUB_USERNAME:
        from_secret: GITHUB_USERNAME
    commands:
      - git config --global user.email "drone@ci.rigidd.app"
      - git config --global user.name "Drone Rigidd"
      - git config --global credential.helper store
      - echo "https://$GITHUB_USERNAME:$GITHUB_TOKEN@github.com" > ~/.git-credentials
      - git clone https://$GITHUB_USERNAME:$GITHUB_TOKEN@github.com/nextplay-dev/nextplay-on-rigidd.git /tmp/infra
      - |
        cd /tmp/infra/API

        DEPL_FILE="deployment.yaml"
        VERSION=${DRONE_BUILD_PARENT}
        echo "Updating $DEPL_FILE with version: $VERSION"
        sed -i "s|image: ghcr.io/nextplay-dev/api:.*|image: ghcr.io/nextplay-dev/api:$VERSION|g" $DEPL_FILE
        git add $DEPL_FILE
        git commit -m "chore: bump api version to $VERSION [CI SKIP]" || echo "No changes to commit"
        git push origin HEAD:main
  - name: deploy
    image: quay.io/argoproj/argocd
    environment:
      ARGOCD_SERVER:
        from_secret: ARGOCD_SERVER
      ARGOCD_AUTH_TOKEN:
        from_secret: ARGOCD_TOKEN
    commands:
      - argocd app sync my-app --grpc-web --force
      - argocd app wait my-app --health --grpc-web